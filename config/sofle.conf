CONFIG_ZMK_KEYBOARD_NAME="Pavlos' Sofle"

# Hardware: KeebMaker wireless Sofle (nice!nano v2, 128x32 OLEDs, one encoder per half,
# WS2812 underglow). The settings below mirror what KeebMaker ships in
# https://github.com/KeebMaker/zmk-config so the board behaves like it did on the vendor firmware.
# Left out on purpose: CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC (it drops C_AL_LOCK and
# C_AL_SCREENSAVER, which the sysctl layer uses).

### OLEDs (widgets come from the zmk-nice-oled module via the "nice_oled" shield in build.yaml)
CONFIG_ZMK_DISPLAY=y

### Encoders (own thread, so the OLED render tick can't delay encoder events)
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_OWN_THREAD=y

### RGB underglow (strip wiring comes from the upstream sofle shield's nice_nano_v2 overlay)
CONFIG_ZMK_RGB_UNDERGLOW=y
# On at boot, but only while on USB: 36 LEDs per half draw more than the battery can supply
# and the half browns out as soon as the cable is pulled. kbctl + B toggles, kbctl + V cycles
# the effect (see pvinis_split_layers.dtsi); on battery, toggle on at your own risk.
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y
# 0 solid, 1 breathe, 2 spectrum, 3 swirl
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
# Start well below full brightness so a manual toggle on battery has a chance.
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=30
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=1
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# Don't cut external power (and with it the OLEDs) when toggling the underglow off.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

### Power
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_SLEEP=y
# Idle after 1 min (turns the underglow off); deep sleep keeps ZMK's 15 min default.
CONFIG_ZMK_IDLE_TIMEOUT=60000

### Bluetooth: stronger radio and the more stable connection parameters
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

### Input latency (eager debounce)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
